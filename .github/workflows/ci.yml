name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run test suite
        run: ./tests/run-tests.sh

      - name: Run CI checks (strict)
        run: ./scripts/ci-check.sh --strict
